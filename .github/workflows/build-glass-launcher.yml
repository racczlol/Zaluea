# Builds the Glass Launcher APK every time code is pushed.
# Result 1: a downloadable "artifact" (zip) on the workflow run page.
# Result 2: a "Latest Glass Launcher build" release with the .apk attached (easiest to grab on a phone).
name: Build Glass Launcher APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GlassLauncher

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher.apk

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: GlassLauncher-apk
          path: GlassLauncher/GlassLauncher.apk
          if-no-files-found: error

      - name: Publish as "latest-build" release (easy phone download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build GlassLauncher.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest Glass Launcher build" \
            --notes "Built automatically from commit $GITHUB_SHA (branch ${GITHUB_REF_NAME}). Download GlassLauncher.apk below and open it on your phone to install."
